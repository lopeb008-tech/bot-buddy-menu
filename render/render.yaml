services:
  - type: web
    name: telegram-bot
    runtime: docker
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_ONLY
        value: true
    plan: free
